name: Dendritic flake
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: install_files/nix-dendritic
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake show --all-systems --no-update-lock-file
      - run: nix flake check --no-build --all-systems --no-update-lock-file
      - run: nix flake check --no-update-lock-file
