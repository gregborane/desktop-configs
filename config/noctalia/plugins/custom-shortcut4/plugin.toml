id = "yocraft/custom-shortcut4"
name = "Custom Shortcut4"
version = "1.0.0"
plugin_api = 3
author = "yocraft"
license = "MIT"
deprecated = false
icon = "command"
description = "Add a custom control center tile."
tags = [ "shortcut", "utility" ]
dependencies = []

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"

[[setting]]
key = "label"
type = "string"
label_key = "settings.label.label"
description_key = "settings.label.description"
default = "process"

[[setting]]
key = "icon"
type = "glyph"
label_key = "settings.icon.label"
description_key = "settings.icon.description"
default = "device-heart-monitor-filled"

[[setting]]
key = "onclick_cmd"
type = "string"
label_key = "settings.onclick_cmd.label"
description_key = "settings.onclick_cmd.description"
default = "noctalia msg panel-close control-center & xdg-terminal-exec --app-id=com.Util -e btop"
