id = "yocraft/custom-shortcut3"
name = "Custom Shortcut3"
version = "1.0.0"
plugin_api = 3
author = "yocraft"
license = "MIT"
deprecated = false
icon = "command"
description = "Add a custom control center tile."
tags = [ "shortcut", "utility" ]
dependencies = []

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"

[[setting]]
key = "label"
type = "string"
label_key = "settings.label.label"
description_key = "settings.label.description"
default = "systeminfo"

[[setting]]
key = "icon"
type = "glyph"
label_key = "settings.icon.label"
description_key = "settings.icon.description"
default = "file-info-filled"

[[setting]]
key = "onclick_cmd"
type = "string"
label_key = "settings.onclick_cmd.label"
description_key = "settings.onclick_cmd.description"
default = "noctalia msg panel-close control-center & xdg-terminal-exec --app-id=com.Util bash -c 'fastfetch; while true; do read -n 1 -r key; [[ "$key" =~ ^[qQ]$ ]] && break; done'"
